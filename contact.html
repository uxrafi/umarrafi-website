<style>
.contact-page{width:min(1200px,90vw);margin:auto;padding:3.5rem 0 0}
.contact-page-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:4rem;align-items:end}
.contact-page-copy{padding-bottom:3rem}
.contact-page h1{font-size:clamp(3rem,5vw,5rem);margin:0 0 1.25rem}
.contact-page .contact-introduction{font:300 1.1rem/1.8 Lato,Arial,sans-serif;max-width:600px}
.contact-direct-email{font:300 1rem/1.6 Montserrat,Arial,sans-serif;display:inline-block;margin:.5rem 0 1.75rem;color:#34586c;text-underline-offset:4px}
.contact-form{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
.contact-field{display:flex;flex-direction:column;gap:.4rem}
.contact-field.full,.contact-form-note,.contact-submit{grid-column:1/-1}
.contact-field label{font:300 .78rem/1.5 Montserrat,Arial,sans-serif;color:#34586c}
.contact-field input,.contact-field select,.contact-field textarea{width:100%;min-width:0;border:0;border-bottom:1px solid #9eb5c3;border-radius:0;background:transparent;padding:.65rem .2rem;font:300 1rem/1.6 Lato,Arial,sans-serif;color:#172536}
.contact-field textarea{resize:vertical;min-height:120px}
.contact-field input:focus,.contact-field select:focus,.contact-field textarea:focus{outline:2px solid #8daeba;outline-offset:3px}
.speaking-contact-fields{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
.speaking-contact-fields[hidden]{display:none!important}
.contact-form-note{font:300 .85rem/1.6 Lato,Arial,sans-serif;color:#597382;margin:0}
.contact-submit{justify-self:start;background:#4d7186;color:white;border:1px solid #4d7186;border-radius:4px;padding:.8rem 1.4rem;font:300 .85rem/1.4 Montserrat,Arial,sans-serif;cursor:pointer}
.contact-submit:hover{background:#34586c}
.contact-page-portrait{margin:0;position:relative;display:flex;align-items:end;justify-content:center}
.contact-page-portrait:before{content:'';position:absolute;inset:20% -2rem 0;background:radial-gradient(ellipse at bottom,#c3d8e1,transparent 70%);z-index:-1}
.contact-page-portrait img{display:block;width:100%;max-width:470px;height:auto;mask-image:linear-gradient(black 82%,transparent 100%)}
.contact-page-footer{margin-top:0}
@media(max-width:800px){.contact-page-grid{grid-template-columns:1fr;gap:1rem}.contact-page{padding-top:2.5rem}.contact-page-portrait{max-width:330px;margin:auto}.contact-page-copy{padding-bottom:1rem}}
@media(max-width:500px){.contact-form,.speaking-contact-fields{grid-template-columns:1fr}.contact-field{grid-column:1/-1}}
</style><style>
@media(min-width:801px){

.contact-page-portrait{align-self:stretch;min-height:0;overflow:hidden}
.contact-page-portrait img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:100%;width:auto;max-width:none;object-fit:contain;mask-image:none}
}
@media(max-width:800px){.contact-page-portrait img{mask-image:none;max-width:330px}}
</style><style>
@media(min-width:801px){
.contact-page-portrait{transform:translateX(6rem);overflow:visible}

}
</style><style>

.contact-page-portrait img{-webkit-mask-image:none!important;mask-image:none!important;filter:none!important}

}

</style><style>.contact-page-copy>.eyebrow{font-size:1.05rem;letter-spacing:.14em;margin-bottom:1rem}</style><style>body.contact-layout{min-height:100svh;display:flex;flex-direction:column}.contact-layout>.site-header{flex-shrink:0}.contact-layout>.contact-page{flex:1;width:min(1200px,90vw)}.contact-layout>footer.book-landing-footer{margin-top:auto;flex-shrink:0}</style><style>

</header><main class="contact-page"><div class="contact-page-grid"><div class="contact-page-copy"><p class="eyebrow">CONTACT</p><h1>Get in touch.</h1><p class="contact-introduction">For book enquiries, interviews, speaking invitations or a note about something you’ve read, I’d be glad to hear from you.</p><form class="contact-form" id="contact-form"><div class="contact-field"><label for="contact-name">Name</label><input id="contact-name" name="name" autocomplete="name" required maxlength="150"></div><div class="contact-field"><label for="contact-email">Email</label><input id="contact-email" name="email" type="email" autocomplete="email" required maxlength="254"></div><div class="contact-field full"><label for="contact-type">Enquiry type</label><select id="contact-type" name="type"><option>Reader message</option><option>Book enquiry</option><option>Interview or podcast</option><option>Speaking invitation</option><option>Other</option></select></div><div class="speaking-contact-fields" id="speaking-contact-fields" hidden><div class="contact-field"><label for="contact-organization">Organization / event (optional)</label><input id="contact-organization" name="organization" autocomplete="organization" maxlength="200"></div><div class="contact-field"><label for="contact-date">Event date (optional)</label><input id="contact-date" name="date" type="date"></div></div><div class="contact-field full"><label for="contact-message">Message</label><textarea id="contact-message" name="message" required maxlength="5000"></textarea></div><p class="contact-form-note">This opens a prepared message in your email app. Review it there and press Send.</p><button class="contact-submit" type="submit">Open email →</button></form></div><figure class="contact-page-portrait"><img src="images/contact-portrait-full.webp" alt="Umar Rafi wearing a V-neck shirt" width="1086" height="1448"></figure></div></main><footer class="book-landing-footer"><div><a class="wordmark author-wordmark" href="index.html" aria-label="Umar Rafi home"><svg class="ur-logo" viewBox="0 0 72 74" aria-hidden="true" fill="none"><path d="M9 9v34c0 15 8 23 20 23s20-8 20-23V9" /><path d="M29 66V9h14c15 0 22 8 22 18S58 44 43 44H29m13 0 24 23" /></svg><span class="author-name">UMAR RAFI</span></a></div><p>© <span id="year"></span> Umar Rafi</p></footer><script src="script.js?v=mobile-entrance-fix-96"></script><script>
(()=>{const form=document.getElementById('contact-form'),type=document.getElementById('contact-type'),extra=document.getElementById('speaking-contact-fields');
type.addEventListener('change',()=>extra.hidden=type.value!=='Speaking invitation');
form.addEventListener('submit',event=>{event.preventDefault();if(!form.reportValidity())return;const data=new FormData(form);let body='Name: '+data.get('name')+'\nEmail: '+data.get('email')+'\nEnquiry: '+data.get('type');if(type.value==='Speaking invitation'){if(data.get('organization'))body+='\nOrganization / event: '+data.get('organization');if(data.get('date'))body+='\nEvent date: '+data.get('date');}body+='\n\n'+data.get('message');location.href='mailto:uxrafi@hotmail.com?subject='+encodeURIComponent(data.get('type')+' — '+data.get('name'))+'&body='+encodeURIComponent(body);});
})();
</script></body></html>
